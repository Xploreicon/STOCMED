<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your StocMed password</title>
  </head>
  <body style="margin:0;background:#f6f8fb;font-family:Arial,sans-serif;color:#162033">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fff;border:1px solid #e5e9f0;border-radius:12px;padding:32px">
            <tr><td><h1 style="margin:0 0 12px;font-size:24px">Reset your StocMed password</h1></td></tr>
            <tr><td><p style="margin:0 0 24px;line-height:1.6">Enter this time-limited code on the StocMed password reset screen:</p></td></tr>
            <tr><td align="center"><div style="display:inline-block;padding:16px 24px;border-radius:10px;background:#edf5ff;color:#0f5cc0;font-size:30px;font-weight:700;letter-spacing:8px">{{ .Token }}</div></td></tr>
            <tr><td><p style="margin:24px 0 12px;line-height:1.6">If you did not request a password reset, you can safely ignore this email.</p></td></tr>
            <tr><td><p style="margin:0;font-size:13px;color:#697386">For your security, never share this code with anyone.</p></td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
